# ============================================
# 공통 설정 (Git에 포함)
# ============================================

# 서버 설정
server.address=0.0.0.0
server.port=8080
server.ssl.enabled=false
spring.application.name=SecurityMVC

# 토큰 만료 시간 설정
spring.Refresh.token.Expiration=604800000  
spring.Access.token.Expiration=3600000

# Spring MVC 설정
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# 파일 업로드 설정
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Redis 세션 설정
spring.session.store-type=redis
spring.session.timeout=1800
spring.session.prefix=spring:session:sessions:

# 로깅 설정
logging.level.root=INFO
logging.level.com.spring=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ============================================
# 프로파일 설정
# 로컬 개발: spring.profiles.active=local
# 운영 환경: spring.profiles.active=prod
# ============================================
spring.profiles.active=local